<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VedioMaker</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext y='26' x='6' font-size='26' fill='%2317d9ff'%3E%E2%97%86%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app/renderer/app.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="i-box" viewBox="0 0 16 16">
      <path d="M8 2.2 13 5v6l-5 2.8L3 11V5z"/><path d="M3 5l5 2.8L13 5M8 7.8v6"/>
    </symbol>
    <symbol id="i-cylinder" viewBox="0 0 16 16">
      <ellipse cx="8" cy="4" rx="4.5" ry="1.8"/><path d="M3.5 4v7.8c0 1 2 1.9 4.5 1.9s4.5-.9 4.5-1.9V4"/>
    </symbol>
    <symbol id="i-pen" viewBox="0 0 16 16">
      <path d="m3 13 2.4-.5 7.1-7.1-2-2-7.1 7.1z"/><path d="m9.4 4.5 2 2"/>
    </symbol>
    <symbol id="i-empty" viewBox="0 0 16 16">
      <rect x="3.2" y="3.2" width="9.6" height="9.6" rx="1" stroke-dasharray="2 2"/>
      <path d="M8 1.4v3.2M8 11.4v3.2M1.4 8h3.2M11.4 8h3.2"/><circle cx="8" cy="8" r="0.8"/>
    </symbol>
    <symbol id="i-image" viewBox="0 0 16 16">
      <rect x="2.2" y="3.2" width="11.6" height="9.6" rx="1"/>
      <circle cx="5.8" cy="6.4" r="1"/><path d="m3 11 3.1-3 2.3 2 1.8-1.8L13 11"/>
    </symbol>
    <symbol id="i-video" viewBox="0 0 16 16">
      <rect x="2.2" y="3.2" width="11.6" height="9.6" rx="1"/>
      <path d="m6.8 6 3.1 2-3.1 2z" fill="currentColor" stroke="none"/>
    </symbol>
    <symbol id="i-text" viewBox="0 0 16 16">
      <path d="M3 4h10M8 4v9M5.8 13h4.4"/>
    </symbol>
  </svg>
  <div id="app">
    <header id="top">
      <div class="brand"><span class="logo">◆</span> <b>VedioMaker</b> <span class="ver">0.1</span></div>
      <div id="tools" class="toolbar">
        <button id="toolSelect" class="tool on" title="选择工具 (V)">↖</button>
        <button id="toolCamera" class="tool" title="新建相机（当前视口机位）">▣</button>
        <div class="tool-wrap">
          <button id="tool3D" class="tool" title="新建 3D 物体 / 图片 / 视频 / 文字">▦</button>
          <div id="tool3DMenu" class="tool-menu" hidden>
            <div class="tool-menu-label">3D 物体</div>
            <button data-primitive="box"><svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-box"/></svg><span>立方体</span></button>
            <button data-primitive="cylinder"><svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-cylinder"/></svg><span>圆柱</span></button>
            <button data-primitive="pen"><svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-pen"/></svg><span>钢笔</span></button>
            <div class="tool-menu-sep"></div>
            <div class="tool-menu-label">场景元素</div>
            <button data-add="empty" title="只做变换和父级，不进成片"><svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-empty"/></svg><span>空元素</span></button>
            <button data-add="image" title="从 media/ 里选择图片"><svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-image"/></svg><span>图片…</span></button>
            <button data-add="video" title="从 media/ 里选择视频"><svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-video"/></svg><span>视频…</span></button>
            <button data-add="text" title="带厚度的 3D 文字"><svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-text"/></svg><span>3D 文字</span></button>
          </div>
        </div>
        <span class="tool-sep"></span>
        <button id="toolText" class="tool" title="在播放头处新建文字">T</button>
        <button id="toolShape" class="tool" title="在播放头处新建色块">◼</button>
      </div>
      <div class="proj"><span id="projTitle">—</span><span class="sep">/</span><span id="projMeta" class="dim"></span></div>
      <div class="transport">
        <button id="btnUndo" title="撤销 (Ctrl+Z)">↶</button>
        <button id="btnRedo" title="重做 (Ctrl+Shift+Z)">↷</button>
        <span class="vrule"></span>
        <button id="btnPrev" title="上一帧 (←)">⏴</button>
        <button id="btnPlay" title="播放 / 暂停 (Space)">▶</button>
        <button id="btnNext" title="下一帧 (→)">⏵</button>
        <span id="timecode" class="tc">0.00s</span>
      </div>
      <div class="actions">
        <span id="renderBadge" class="badge" hidden></span>
        <button id="btnProject" title="打开项目 (Ctrl+O)">项目</button>
        <button id="btnRestart" title="快速重启 (Ctrl+Shift+R)">重启</button>
        <select id="renderScale" title="渲染分辨率">
          <option value="0.5">50%</option>
          <option value="1">100%</option>
        </select>
        <button id="btnEditMode" title="编辑视口 / 镜头视角 (Tab)">编辑视口</button>
        <button id="btnStill" title="用 Blender 渲染当前时刻的一帧">预览帧</button>
        <button id="btnRender" class="primary">渲染成片</button>
      </div>
    </header>

    <main>
      <aside id="left">
        <div class="panel" id="panelMedia"></div>
      </aside>

      <section id="center">
        <div id="stageWrap">
          <div id="stageBox">
            <canvas id="stage"></canvas>
            <canvas id="gizmo"></canvas>
            <div id="selBox"></div>
          </div>
        </div>
        <div id="stageBar">
          <span id="stageTime" class="mono">0.00 / 0.00s</span>
          <span id="viewMode" class="mode-badge" hidden>选择</span>
          <span id="selInfo" class="sel-info" hidden></span>
          <span class="hint">Tab 编辑视口 · Alt 切换 选择/移动相机 · Ctrl 吸附 0.5m · G 网格 · 右键菜单 · 空格播放</span>
        </div>
      </section>

      <aside id="right">
        <div class="tabs" data-tabs="right">
          <button data-tab="insp" class="on">检查器</button>
          <button data-tab="ai">AI</button>
          <button data-tab="pipe">流水线</button>
          <button data-tab="logs">日志</button>
        </div>
        <div class="panel" id="panelInsp"></div>
        <div class="panel" id="panelAI" hidden></div>
        <div class="panel" id="panelPipe" hidden></div>
        <div class="panel" id="panelLogs" hidden></div>
      </aside>
    </main>

    <footer id="timeline"></footer>
    <div id="toasts"></div>
    <div id="ctxMenu" class="ctx-menu" hidden></div>

    <div id="projectModal" class="modal" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <div>
            <strong>打开项目</strong>
            <span id="projCurrent" class="hint"></span>
          </div>
          <button id="projClose" class="mini" title="关闭">×</button>
        </div>
        <div id="projList" class="proj-list"></div>
        <div class="modal-foot">
          <button id="projNew">新建项目…</button>
          <button id="projBrowse">打开文件夹…</button>
          <span class="spacer"></span>
          <button id="projRestart">重启当前项目</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/app/renderer/js/main.js"></script>
</body>
</html>
