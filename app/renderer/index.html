    <symbol id="i-text" viewBox="0 0 16 16">

    <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z"/><circle cx="8" cy="8" r="2"/></symbol>

    <symbol id="i-command" viewBox="0 0 16 16"><path d="M6 6h4v4H6z"/><path d="M6 6H4.5A1.5 1.5 0 1 1 6 4.5zM10 6V4.5A1.5 1.5 0 1 1 11.5 6zM10 10h1.5a1.5 1.5 0 1 1-1.5 1.5zM6 10v1.5A1.5 1.5 0 1 1 4.5 10z"/></symbol>

    <symbol id="i-photo" viewBox="0 0 16 16"><path d="M2.5 5.5a1 1 0 0 1 1-1h1.8l1-1.5h3.4l1 1.5h1.8a1 1 0 0 1 1 1V12a1 1 0 0 1-1 1h-9a1 1 0 0 1-1-1z"/><circle cx="8" cy="8.5" r="2.25"/></symbol>
    <symbol id="i-terminal" viewBox="0 0 16 16"><rect x="1.75" y="2.75" width="12.5" height="10.5" rx="1.5"/><path d="m4.5 6 2 2-2 2M8 10.5h3.5"/></symbol>
    <symbol id="i-sparkles" viewBox="0 0 16 16"><path d="M6.5 2.5 7.6 5.9 11 7 7.6 8.1 6.5 11.5 5.4 8.1 2 7 5.4 5.9z"/><path d="M12 10v3.5M10.25 11.75h3.5"/></symbol>
    <symbol id="i-folder" viewBox="0 0 16 16"><path d="M2 4.5a1 1 0 0 1 1-1h3l1.5 1.5H13a1 1 0 0 1 1 1v6a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1z"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 16 16"><path d="M13.5 8A5.5 5.5 0 1 1 8 2.5c1.5 0 2.9.6 4 1.6l1.5 1.4"/><path d="M13.5 2.5v3h-3"/></symbol>

    <symbol id="i-lock-open" viewBox="0 0 16 16"><rect x="3.5" y="7" width="9" height="6.5" rx="1.2"/><path d="M5.5 7V5.2a2.5 2.5 0 0 1 4.9-.6"/><circle cx="8" cy="10.2" r=".5" fill="currentColor"/></symbol>
  </svg>
  <div id="app">
    <header id="top">
      <div class="top-left">
        <svg class="ic logo" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-keyframe"/></svg>
        <button id="btnProject" class="btn ghost proj-btn" aria-haspopup="menu" aria-label="项目" data-tip="项目">
          <span id="projTitle">—</span>
          <svg class="ic ic-sm" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-chevron-down"/></svg>
        </button>
        <span class="vrule"></span>
        <button id="btnUndo" class="icon-btn" aria-label="撤销" data-tip="撤销" data-kbd="Ctrl+Z"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-undo"/></svg></button>
        <button id="btnRedo" class="icon-btn" aria-label="重做" data-tip="重做" data-kbd="Ctrl+Shift+Z"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-redo"/></svg></button>
      </div>
      <div id="tools" class="toolbar top-center">
        <button id="toolSelect" class="tool on" aria-pressed="true" aria-label="选择" data-tip="选择" data-kbd="V"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-pointer"/></svg><span class="tool-label">选择</span></button>
        <span class="tool-sep"></span>
        <button id="toolCamera" class="tool" aria-label="相机" data-tip="相机&#10;用当前视口机位新建相机"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-camera"/></svg><span class="tool-label">相机</span></button>
        <button id="toolText" class="tool" aria-label="文字" data-tip="文字&#10;在播放头处新建文字"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-text"/></svg><span class="tool-label">文字</span></button>
        <button id="toolShape" class="tool" aria-label="色块" data-tip="色块&#10;在播放头处新建色块"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-square"/></svg><span class="tool-label">色块</span></button>
        <div class="tool-wrap">
          <button id="tool3D" class="tool" aria-haspopup="menu" aria-label="3D" data-tip="3D&#10;新建 3D 物体 / 图片 / 视频 / 文字" data-kbd="Shift+A"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-cube"/></svg><span class="tool-label">3D</span><svg class="ic ic-sm caret" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-chevron-down"/></svg></button>
          <div id="tool3DMenu" class="tool-menu" hidden>
            <div class="tool-menu-label">3D 物体</div>
            <button data-primitive="box"><svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-box"/></svg><span>立方体</span></button>
            <button data-primitive="cylinder"><svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-cylinder"/></svg><span>圆柱</span></button>
            <button data-primitive="pen"><svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-pen"/></svg><span>钢笔</span></button>
            <div class="tool-menu-sep"></div>
            <div class="tool-menu-label">场景元素</div>
            <button data-add="empty" data-tip="只做变换和父级，不进成片"><svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-empty"/></svg><span>空元素</span></button>
            <button data-add="image" data-tip="从 media/ 里选择图片"><svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-image"/></svg><span>图片…</span></button>
            <button data-add="video" data-tip="从 media/ 里选择视频"><svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-video"/></svg><span>视频…</span></button>
            <button data-add="text" data-tip="带厚度的 3D 文字"><svg class="mi" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-text"/></svg><span>3D 文字</span></button>
          </div>
        </div>
      </div>
      <div class="top-right">
        <div id="viewSeg" class="seg" role="group" aria-label="视图" hidden>
          <button id="btnViewEdit" data-view="edit" aria-pressed="false" data-tip="编辑视口&#10;自由机位，可拖动元素和相机路径" data-kbd="Tab">编辑视口</button>
          <button id="btnViewCam" data-view="cam" aria-pressed="true" data-tip="镜头视角&#10;按成片相机看画面" data-kbd="Tab">镜头视角</button>
        </div>
        <button id="btnCommand" class="icon-btn" aria-label="命令面板" data-tip="命令面板" data-kbd="Ctrl+K"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-command"/></svg></button>
        <button id="btnStill" class="btn" data-tip="预览帧&#10;用 Blender 渲染当前时刻的一帧"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-photo"/></svg><span>预览帧</span></button>
        <div class="split-btn">
          <button id="btnRender" class="btn primary" data-tip="渲染成片&#10;用 Blender 渲染整条时间线"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-film"/></svg><span>渲染成片</span></button>
          <button id="btnRenderMenu" class="btn primary" aria-haspopup="menu" aria-label="渲染选项" data-tip="渲染选项&#10;分辨率、渲染当前段、取消"><svg class="ic ic-sm" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-chevron-down"/></svg></button>
        </div>
      </div>
    </header>

    <main>
      <aside id="left">
        <div class="tabs" role="tablist" aria-label="左栏" data-tabs="left">
          <button role="tab" data-tab="media" class="on" aria-selected="true" aria-controls="panelMedia">资源</button>
          <button role="tab" data-tab="layers" aria-selected="false" aria-controls="panelLayers">图层</button>
        </div>
        <div class="panel" id="panelMedia" role="tabpanel"></div>
        <div class="panel" id="panelLayers" role="tabpanel" hidden></div>
      </aside>
      <div id="splitLeft" class="splitter" role="separator" aria-orientation="vertical" aria-label="调整左栏宽度（双击折叠）"></div>

      <section id="center">
        <div id="stageToolbar">
          <div class="st-left">
            <span id="viewBadge" class="badge">镜头视角</span>
            <div id="viewMode" class="seg" role="group" aria-label="编辑视口工具" hidden>
              <button data-mode="select" aria-pressed="true" data-tip="选择&#10;点选、拖动元素和路径" data-kbd="Alt">选择</button>
              <button data-mode="move" aria-pressed="false" data-tip="移动&#10;拖动环绕、滚轮推拉、WASDQE 飞行" data-kbd="Alt">移动</button>
            </div>
          </div>
          <div class="st-mid">
            <button id="btnGrid" class="btn ghost mini" aria-pressed="true" data-tip="网格" data-kbd="G"><svg class="ic ic-sm" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-grid"/></svg><span>网格</span></button>
            <button id="btnSafe" class="btn ghost mini" aria-pressed="false" data-tip="安全框&#10;90% 字幕安全框 · 93% 动作安全框 · 中心十字（不进成片）"><svg class="ic ic-sm" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-safe-frame"/></svg><span>安全框</span></button>
            <button id="followHint" class="btn ghost mini" type="button" data-tip="跟随中；点击脱离，保持当前视角" hidden></button>
            <span id="stageHint" class="hint"></span>
          </div>
          <div class="st-right">
            <span id="stageMeta" class="mono dim"></span>
          </div>
        </div>
        <div id="stageWrap">
          <div id="stageBox">
            <canvas id="stage"></canvas>
            <canvas id="gizmo"></canvas>
            <svg id="selBox" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
              <polygon id="selPoly" points=""></polygon>
            </svg>
            <div id="selLabel"></div>
            <svg id="feedHints" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true" hidden></svg>
            <svg id="safeArea" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true" hidden>
              <rect class="sa-action" x="67.2" y="37.8" width="1785.6" height="1004.4"></rect>
              <rect class="sa-title" x="96" y="54" width="1728" height="972"></rect>
              <path class="sa-cross" d="M920 540H1000M960 500V580"></path>
            </svg>
            <div id="inlineTextLayer" class="inline-text-layer" hidden>
              <textarea id="inlineTextArea" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off"></textarea>
            </div>
          </div>
        </div>
        <div id="transport">
          <button id="btnFirst" class="icon-btn" aria-label="首帧" data-tip="首帧" data-kbd="Home"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-skip-start"/></svg></button>
          <button id="btnPrev" class="icon-btn" aria-label="上一帧" data-tip="上一帧&#10;Shift+← 后退 1 秒" data-kbd="←"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-step-back"/></svg></button>
          <button id="btnPlay" class="icon-btn lg" aria-label="播放" data-tip="播放 / 暂停" data-kbd="Space"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-play"/></svg></button>
          <button id="btnNext" class="icon-btn" aria-label="下一帧" data-tip="下一帧&#10;Shift+→ 前进 1 秒" data-kbd="→"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-step-fwd"/></svg></button>
          <button id="btnLast" class="icon-btn" aria-label="末帧" data-tip="末帧" data-kbd="End"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-skip-end"/></svg></button>
          <button id="btnLoop" class="icon-btn" aria-label="循环播放" aria-pressed="false" data-tip="循环播放" data-kbd="L"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-repeat"/></svg></button>
          <span class="vrule"></span>
          <span id="timecode" class="tc" role="button" tabindex="0" aria-label="当前时间（点击输入跳转）" data-tip="当前时间&#10;点击输入：1.8 · 1:02.5 · 54f"></span>
          <span id="tcDuration" class="tc-dur mono"></span>
          <span class="tr-spacer"></span>
          <span id="selInfo" class="sel-info" hidden><span id="selType" class="badge"></span><span id="selName" class="sel-name"></span></span>
          <button id="btnHelp" class="icon-btn" aria-label="快捷键速查" data-tip="快捷键速查" data-kbd="?"><svg class="ic" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-help"/></svg></button>
        </div>
      </section>

      <div id="splitRight" class="splitter" role="separator" aria-orientation="vertical" aria-label="调整右栏宽度（双击折叠）"></div>
      <aside id="right">
        <div class="tabs" role="tablist" aria-label="右栏" data-tabs="right">
          <button role="tab" data-tab="insp" class="on" aria-selected="true" aria-controls="panelInsp">属性</button>
          <button role="tab" data-tab="ai" aria-selected="false" aria-controls="panelAI">AI</button>
          <button role="tab" data-tab="review" aria-selected="false" aria-controls="panelReview">审阅</button>
          <button role="tab" data-tab="pipe" aria-selected="false" aria-controls="panelPipe">渲染</button>
        </div>
        <div class="panel" id="panelInsp" role="tabpanel"></div>
        <div class="panel" id="panelAI" role="tabpanel" hidden></div>
        <div class="panel" id="panelReview" role="tabpanel" hidden></div>
        <div class="panel" id="panelPipe" role="tabpanel" hidden></div>
      </aside>

      <button id="edgeLeft" class="edge-handle left" aria-label="展开左栏" data-tip="展开左栏" hidden><svg class="ic ic-sm" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-chevron-right"/></svg></button>
      <button id="edgeRight" class="edge-handle right" aria-label="展开右栏" data-tip="展开右栏" hidden><svg class="ic ic-sm" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-chevron-left"/></svg></button>
    </main>

    <div id="splitTimeline" class="splitter row" role="separator" aria-orientation="horizontal" aria-label="调整时间轴高度（双击恢复默认）"></div>
    <footer id="timeline"></footer>

    <footer id="statusbar">
      <div class="sb-left">
        <span id="sbConn" class="sb-conn warn" data-tip="引擎连接"><span class="dot"></span><span class="sb-text">连接中</span></span>
        <span id="sbBlender" class="badge" data-tip="Blender">Blender</span>
        <span id="sbFfmpeg" class="badge" data-tip="ffmpeg">ffmpeg</span>
        <span id="sbAI" class="badge" data-tip="AI">AI</span>
      </div>
      <div id="sbRender" class="sb-render" hidden>
        <span id="sbRenderText" class="mono"></span>
        <span class="progress"><span id="sbRenderBar" class="bar"></span></span>
        <button id="sbRenderCancel" class="icon-btn mini" aria-label="取消渲染" data-tip="取消渲染"><svg class="ic ic-sm" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-x"/></svg></button>
      </div>
      <div class="sb-right">
        <span id="projMeta" class="mono"></span>
        <button id="btnLogs" class="btn ghost mini" aria-pressed="false" aria-controls="logDrawer" data-tip="日志&#10;.vdm/logs 运行日志"><svg class="ic ic-sm" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-terminal"/></svg><span>日志</span><span id="logCount" class="badge badge-warn" hidden></span></button>
      </div>
    </footer>

    <section id="logDrawer" aria-label="日志" hidden>
      <button id="logDrawerClose" class="icon-btn mini" aria-label="收起日志" data-tip="收起日志" data-kbd="Esc"><svg class="ic ic-sm" viewBox="0 0 16 16" aria-hidden="true"><use href="#i-x"/></svg></button>
      <div class="panel" id="panelLogs"></div>
    </section>

    <div id="toasts"></div>
    <div id="ctxMenu" class="ctx-menu" hidden></div>

    <div id="projectModal" class="modal" hidden>
      <div class="modal-card">
        <div class="modal-head">
          <div>
            <strong>打开项目</strong>
            <span id="projCurrent" class="hint"></span>
          </div>
          <button id="projClose" class="mini" title="关闭">×</button>
        </div>
        <div id="projList" class="proj-list"></div>
        <div class="modal-foot">
          <button id="projNew">新建项目…</button>
          <button id="projBrowse">打开文件夹…</button>
          <span class="spacer"></span>
          <button id="projRestart">重启当前项目</button>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/app/renderer/js/main.js"></script>
</body>
</html>
